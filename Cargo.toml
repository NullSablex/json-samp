[package]
name = "json-samp"
version = "2.0.0"
edition = "2024"
authors = ["NullSablex <https://github.com/NullSablex>"]
repository = "https://github.com/NullSablex/json-samp"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
samp = { git = "https://github.com/NullSablex/rust-samp.git", tag = "v3.0.0", features = ["encoding"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1

[package.metadata.samp]
uid = "0x1fd4e3cb42aa0e7d"
