site_name: json-samp
site_description: JSON plugin for SA-MP and Open Multiplayer, written in Rust
site_author: NullSablex
site_url: https://nullsablex.github.io/json-samp/

repo_name: NullSablex/json-samp
repo_url: https://github.com/NullSablex/json-samp
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Permanent link
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Installation: installation.md
  - Guide:
      - Handles & conventions: handles.md
      - Parsing & reading: reading.md
      - Building & serializing: building.md
      - Path API: paths.md
      - Arrays: arrays.md
      - File I/O: files.md
      - Inspection & navigation: inspection.md
      - Utilities & diagnostics: utilities.md
  - Reference:
      - API reference: api-reference.md
      - Error codes: errors.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NullSablex/json-samp
