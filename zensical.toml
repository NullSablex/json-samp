[project]
site_name = "json-samp"
site_url = "https://nullsablex.github.io/json-samp/"
site_description = "JSON plugin for SA-MP and Open Multiplayer, written in Rust"
site_author = "NullSablex"
repo_name = "NullSablex/json-samp"
repo_url = "https://github.com/NullSablex/json-samp"
edit_uri = "edit/master/docs/"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Guide" = [
    { "Handles & conventions" = "handles.md" },
    { "Parsing & reading" = "reading.md" },
    { "Building & serializing" = "building.md" },
    { "Path API" = "paths.md" },
    { "Arrays" = "arrays.md" },
    { "File I/O" = "files.md" },
    { "Inspection & navigation" = "inspection.md" },
    { "Utilities & diagnostics" = "utilities.md" },
  ] },
  { "Reference" = [
    { "API reference" = "api-reference.md" },
    { "Error codes" = "errors.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "navigation.indexes",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.action.edit",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "light blue"
toggle.icon = "lucide/sun"
toggle.name = "Light mode"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
permalink_title = "Permanent link"
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"
